services:
  # ==========================================
  # 1. MongoDB Database Container
  # ==========================================
  database:
    image: mongo:7.0
    container_name: ilveliero-database
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ilveliero
    volumes:
      - mongo_data:/data/db
    networks:
      - veliero-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Node.js + Express REST API Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ilveliero-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - MONGODB_URI=${MONGODB_URI:-mongodb://database:27017/ilveliero}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-*}
      - AUTO_SEED_IF_EMPTY=${AUTO_SEED_IF_EMPTY:-true}
      - JWT_SECRET=${JWT_SECRET:-il_veliero_default_jwt_secret_change_in_production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-5}
      - MASTER_ADMIN_EMAILS=${MASTER_ADMIN_EMAILS:-admin@ilveliero.it}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL:-admin@ilveliero.it}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-AdminSecurePassword123!}
      - GESTORE_DEFAULT_EMAIL=${GESTORE_DEFAULT_EMAIL:-gestore@ilveliero.it}
      - GESTORE_DEFAULT_PASSWORD=${GESTORE_DEFAULT_PASSWORD:-GestoreSecurePassword123!}
      - CLIENT_DEFAULT_EMAIL=${CLIENT_DEFAULT_EMAIL:-cliente@ilveliero.it}
      - CLIENT_DEFAULT_PASSWORD=${CLIENT_DEFAULT_PASSWORD:-ClientSecurePassword123!}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - veliero-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 3. Angular + Nginx Frontend Container
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ilveliero-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
      - "8081:80"
    networks:
      - veliero-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==========================================
# Persistent Volumes & Network Definitions
# ==========================================
volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  veliero-network:
    driver: bridge
