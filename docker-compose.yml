services:
  # ==========================================
  # 1. MongoDB Database Container
  # ==========================================
  database:
    image: mongo:7.0
    container_name: ilveliero-database
    restart: unless-stopped
    # ports:                  # ← RIMOSSO: MongoDB NON deve essere esposto sull'host.
    #   - "27017:27017"       #   Il backend si connette via rete Docker interna (database:27017).
    environment:
      - MONGO_INITDB_DATABASE=ilveliero
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
    networks:
      - db-backend-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Node.js + Express REST API Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ilveliero-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI is required}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:4200}
      - AUTO_SEED_IF_EMPTY=${AUTO_SEED_IF_EMPTY:-false}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - MASTER_EMERGENCY_KEY=${MASTER_EMERGENCY_KEY:?MASTER_EMERGENCY_KEY is required}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-5}
      - MASTER_ADMIN_EMAILS=${MASTER_ADMIN_EMAILS:-admin@ilveliero.it}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - GESTORE_DEFAULT_EMAIL=${GESTORE_DEFAULT_EMAIL}
      - GESTORE_DEFAULT_PASSWORD=${GESTORE_DEFAULT_PASSWORD}
      - CLIENT_DEFAULT_EMAIL=${CLIENT_DEFAULT_EMAIL}
      - CLIENT_DEFAULT_PASSWORD=${CLIENT_DEFAULT_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - db-backend-net
      - web-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 3. Angular + Nginx Frontend Container
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ilveliero-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
      - "8081:80"
    networks:
      - web-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==========================================
# Persistent Volumes & Network Definitions
# ==========================================
volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  # Internal isolated network between database and backend only
  db-backend-net:
    driver: bridge
    internal: true
  # Web network between frontend and backend
  web-net:
    driver: bridge
