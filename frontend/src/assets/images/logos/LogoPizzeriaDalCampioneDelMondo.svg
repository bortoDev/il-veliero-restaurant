<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" aria-label="Logo Pizza Campione del Mondo">
  <defs>
    <!-- Laurel Wreath Green Gradients -->
    <linearGradient id="laurelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916c"/>
      <stop offset="60%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>

    <!-- Globe Ocean Blue Gradient -->
    <radialGradient id="globeOcean" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a6fdb"/>
      <stop offset="50%" stop-color="#1d4e89"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </radialGradient>

    <!-- Gold Continent Landmasses -->
    <linearGradient id="goldLand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>

    <!-- Gold Ribbon Banner Gradient -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="30%" stop-color="#ffd166"/>
      <stop offset="80%" stop-color="#e9c46a"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#07192f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g id="campione-del-mondo-art" filter="url(#badgeShadow)">
    <!-- ============================================== -->
    <!-- GREEN LAUREL WREATH (CORONA D'ALLORO)         -->
    <!-- ============================================== -->
    <g id="laurel-wreath" fill="url(#laurelGreen)" stroke="#1b4332" stroke-width="1.2">
      <!-- Left Laurel Branch Leaves -->
      <path d="M 120,40 C 95,50 85,75 105,90 C 115,75 125,55 120,40 Z"/>
      <path d="M 90,70 C 65,85 60,115 80,130 C 90,110 100,90 90,70 Z"/>
      <path d="M 70,115 C 45,135 45,165 70,180 C 78,160 88,140 70,115 Z"/>
      <path d="M 60,170 C 35,190 40,225 65,235 C 72,215 80,195 60,170 Z"/>
      <path d="M 60,230 C 38,255 45,285 72,295 C 76,275 82,255 60,230 Z"/>
      <path d="M 72,290 C 55,315 70,345 98,350 C 98,330 100,310 72,290 Z"/>

      <!-- Right Laurel Branch Leaves -->
      <path d="M 380,40 C 405,50 415,75 395,90 C 385,75 375,55 380,40 Z"/>
      <path d="M 410,70 C 435,85 440,115 420,130 C 410,110 400,90 410,70 Z"/>
      <path d="M 430,115 C 455,135 455,165 430,180 C 422,160 412,140 430,115 Z"/>
      <path d="M 440,170 C 465,190 460,225 435,235 C 428,215 420,195 440,170 Z"/>
      <path d="M 440,230 C 462,255 455,285 428,295 C 424,275 418,255 440,230 Z"/>
      <path d="M 428,290 C 445,315 430,345 402,350 C 402,330 400,310 428,290 Z"/>
    </g>

    <!-- ============================================== -->
    <!-- ARCHED TEXT "PIZZA"                            -->
    <!-- ============================================== -->
    <g id="pizza-title" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" text-anchor="middle">
      <path id="pizza-arc" d="M 120,180 Q 250,75 380,180" fill="none"/>
      <text fill="#ffd166" stroke="#000000" stroke-width="4" stroke-linejoin="round" letter-spacing="8">
        <textPath href="#pizza-arc" startOffset="50%" text-anchor="middle">
          PIZZA
        </textPath>
      </text>
    </g>

    <!-- ============================================== -->
    <!-- CENTRAL BLUE GLOBE WITH WORLD MAP             -->
    <!-- ============================================== -->
    <g id="world-globe">
      <!-- Globe Ellipse / Sphere -->
      <ellipse cx="250" cy="245" rx="140" ry="110" fill="url(#globeOcean)" stroke="#0b2545" stroke-width="3"/>

      <!-- Continents (Stylized North & South America, Europe, Africa, Asia, Australia in Gold) -->
      <g fill="url(#goldLand)" stroke="#d4a373" stroke-width="0.8">
        <!-- North America -->
        <path d="M 140,195 Q 165,185 190,198 Q 210,215 195,230 Q 170,235 155,215 Z"/>
        <path d="M 175,182 Q 195,170 215,180 Q 205,192 185,190 Z"/>

        <!-- South America -->
        <path d="M 180,235 Q 200,230 205,248 Q 200,270 188,275 Q 175,255 180,235 Z"/>

        <!-- Europe & Middle East -->
        <path d="M 245,190 Q 265,182 278,195 Q 270,210 255,208 Q 242,202 245,190 Z"/>

        <!-- Africa -->
        <path d="M 245,212 Q 275,210 280,235 Q 275,268 258,272 Q 245,255 245,212 Z"/>

        <!-- Asia -->
        <path d="M 280,185 Q 330,175 365,195 Q 375,225 345,230 Q 315,220 290,225 Q 275,205 280,185 Z"/>

        <!-- Australia -->
        <path d="M 335,248 Q 360,245 365,262 Q 345,272 330,260 Z"/>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- GOLDEN BANNER RIBBON "CAMPIONE DEL MONDO"     -->
    <!-- ============================================== -->
    <g id="ribbon-banner">
      <!-- Left Ribbon Fold / Tail -->
      <path d="M 100,290 L 140,260 L 145,340 L 115,360 Z" fill="#b07d1a" stroke="#6b4c09" stroke-width="1.5"/>
      <path d="M 115,360 L 145,340 L 175,350 Z" fill="#7a5304"/>

      <!-- Right Ribbon Fold / Tail -->
      <path d="M 400,290 L 360,260 L 355,340 L 385,360 Z" fill="#b07d1a" stroke="#6b4c09" stroke-width="1.5"/>
      <path d="M 385,360 L 355,340 L 325,350 Z" fill="#7a5304"/>

      <!-- Main Center Curved Banner Ribbon -->
      <path d="M 105,300 
               Q 250,235 395,300 
               L 410,350 
               Q 250,295 90,350 Z" 
            fill="url(#goldRibbon)" stroke="#8a5e07" stroke-width="2.5"/>

      <!-- Banner Ribbon Text "CAMPIONE DEL MONDO" in Bold Navy -->
      <g font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" text-anchor="middle" fill="#0b2545">
        <!-- Top Arched Line: CAMPIONE -->
        <path id="campione-arc" d="M 125,312 Q 250,256 375,312" fill="none"/>
        <text font-size="34" letter-spacing="3">
          <textPath href="#campione-arc" startOffset="50%" text-anchor="middle">
            CAMPIONE
          </textPath>
        </text>

        <!-- Bottom Arched Line: DEL MONDO -->
        <path id="del-mondo-arc" d="M 140,344 Q 250,296 360,344" fill="none"/>
        <text font-size="24" letter-spacing="4">
          <textPath href="#del-mondo-arc" startOffset="50%" text-anchor="middle">
            DEL MONDO
          </textPath>
        </text>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- SUBTITLE: "RISTORANTE - PIZZERIA"             -->
    <!-- ============================================== -->
    <text x="250" y="445" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="30" 
          font-weight="bold"
          fill="#ffffff" 
          stroke="#000000" 
          stroke-width="3" 
          stroke-linejoin="round"
          text-anchor="middle" 
          letter-spacing="3">
      RISTORANTE - PIZZERIA
    </text>
  </g>
</svg>
