<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" aria-label="Logo Ufficiale Ristorante Il Veliero">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="skyCircleBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0fbfc"/>
      <stop offset="90%" stop-color="#bde0fe"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </radialGradient>

    <!-- Navy Line-art Ink Gradient -->
    <linearGradient id="navyInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143666"/>
      <stop offset="50%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#06182e"/>
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b2545" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="logo-veliero-official" filter="url(#logoShadow)">
    <!-- ============================================== -->
    <!-- CIRCULAR BLUE EMBLEM BACKDROP                  -->
    <!-- ============================================== -->
    <circle cx="250" cy="210" r="160" fill="url(#skyCircleBg)" stroke="#0096c7" stroke-width="5"/>

    <!-- ============================================== -->
    <!-- THREE-MASTED SAILING SHIP (LINE-ART ETCHING)   -->
    <!-- ============================================== -->
    <g id="ship-art" stroke="url(#navyInk)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Masts & Spars -->
      <!-- Mainmast (Center tall) -->
      <line x1="270" y1="280" x2="280" y2="40" stroke-width="3.5"/>
      <line x1="230" y1="65" x2="320" y2="65" stroke-width="2.5"/>
      <line x1="215" y1="120" x2="335" y2="120" stroke-width="3"/>
      <line x1="205" y1="180" x2="345" y2="180" stroke-width="3"/>
      <line x1="195" y1="245" x2="355" y2="245" stroke-width="3.5"/>

      <!-- Foremast (Left) -->
      <line x1="190" y1="275" x2="195" y2="90" stroke-width="3"/>
      <line x1="150" y1="110" x2="235" y2="110" stroke-width="2.2"/>
      <line x1="140" y1="160" x2="245" y2="160" stroke-width="2.6"/>
      <line x1="130" y1="220" x2="255" y2="220" stroke-width="3"/>

      <!-- Mizzenmast (Right) -->
      <line x1="345" y1="275" x2="350" y2="110" stroke-width="2.8"/>
      <line x1="315" y1="130" x2="385" y2="130" stroke-width="2"/>
      <line x1="305" y1="180" x2="395" y2="180" stroke-width="2.4"/>

      <!-- Bowsprit -->
      <line x1="180" y1="270" x2="95" y2="220" stroke-width="3.5"/>

      <!-- Main Pennant Flag -->
      <path d="M 280,40 Q 320,30 360,42 L 340,49 L 360,56 Q 320,48 280,45 Z" fill="#0b2545" stroke-width="1"/>

      <!-- Standing & Running Rigging Lines -->
      <g stroke-width="0.8" opacity="0.85">
        <line x1="95" y1="220" x2="195" y2="90"/>
        <line x1="120" y1="235" x2="195" y2="160"/>
        <line x1="150" y1="250" x2="195" y2="220"/>
        <line x1="195" y1="90" x2="280" y2="40"/>
        <line x1="195" y1="160" x2="280" y2="120"/>
        <line x1="280" y1="120" x2="350" y2="110"/>
        <!-- Shrouds & Ratlines -->
        <line x1="195" y1="160" x2="165" y2="275"/>
        <line x1="195" y1="160" x2="175" y2="275"/>
        <line x1="195" y1="160" x2="185" y2="275"/>
        <line x1="280" y1="120" x2="245" y2="280"/>
        <line x1="280" y1="120" x2="255" y2="280"/>
        <line x1="280" y1="120" x2="265" y2="280"/>
      </g>

      <!-- Sails (Etched Line Art with White/Cream Fill) -->
      <g fill="#ffffff" fill-opacity="0.95" stroke-width="1.6">
        <!-- Jibs -->
        <path d="M 98,218 Q 150,195 193,92 Q 160,165 102,222 Z"/>
        <path d="M 125,232 Q 165,215 193,162 Q 168,205 128,236 Z"/>

        <!-- Foremast Sails -->
        <path d="M 152,110 Q 192,118 232,110 Q 238,145 240,158 Q 192,170 142,158 Q 146,145 152,110 Z"/>
        <path d="M 142,160 Q 192,170 242,160 Q 248,205 250,218 Q 192,230 132,218 Q 136,205 142,160 Z"/>
        <path d="M 132,220 Q 192,232 252,220 Q 258,262 260,274 Q 192,286 122,274 Q 126,262 132,220 Z"/>

        <!-- Mainmast Sails -->
        <path d="M 232,65 Q 275,72 318,65 Q 324,105 328,118 Q 275,128 220,118 Q 224,105 232,65 Z"/>
        <path d="M 220,120 Q 275,132 330,120 Q 338,165 340,178 Q 275,190 210,178 Q 214,165 220,120 Z"/>
        <path d="M 208,180 Q 275,194 342,180 Q 350,230 352,242 Q 275,256 198,242 Q 202,230 208,180 Z"/>
        <path d="M 198,245 Q 275,260 352,245 Q 360,285 362,295 Q 275,310 188,295 Q 192,285 198,245 Z"/>

        <!-- Mizzen Sails -->
        <path d="M 318,130 Q 350,136 382,130 Q 388,165 390,176 Q 350,185 310,176 Q 314,165 318,130 Z"/>
        <path d="M 345,220 L 405,200 Q 418,235 412,270 L 345,275 Z"/>
      </g>

      <!-- Shading Hatches on Sails -->
      <g stroke-width="0.7" opacity="0.6">
        <line x1="240" y1="130" x2="238" y2="170"/>
        <line x1="275" y1="132" x2="275" y2="175"/>
        <line x1="310" y1="130" x2="312" y2="170"/>
        <line x1="230" y1="190" x2="226" y2="235"/>
        <line x1="275" y1="194" x2="275" y2="242"/>
        <line x1="320" y1="190" x2="324" y2="235"/>
      </g>

      <!-- Galleon Hull Structure -->
      <g fill="#0b2545">
        <path d="M 145,270 
                 C 130,270 115,278 105,285 
                 C 120,315 155,348 245,352 
                 C 335,355 395,335 418,305 
                 L 420,270 
                 C 395,274 365,276 345,276 
                 L 165,270 Z" 
              stroke="#0b2545" stroke-width="2.5"/>

        <!-- Stern Gallery (Poppa) -->
        <path d="M 365,275 L 420,270 L 418,245 L 380,250 Z" stroke="#0b2545" stroke-width="1.5"/>
      </g>

      <!-- Gun Ports & Hull Detailing -->
      <g fill="#ffffff" stroke="#ffffff" stroke-width="0.8">
        <rect x="160" y="288" width="8" height="7" rx="1"/>
        <rect x="195" y="293" width="8" height="7" rx="1"/>
        <rect x="230" y="296" width="8" height="7" rx="1"/>
        <rect x="265" y="297" width="8" height="7" rx="1"/>
        <rect x="300" y="295" width="8" height="7" rx="1"/>
        <rect x="335" y="292" width="8" height="7" rx="1"/>
        <rect x="370" y="288" width="8" height="7" rx="1"/>
      </g>

      <!-- Waterline Sea Waves -->
      <g fill="#0b2545" stroke="#0b2545" stroke-width="1.5">
        <path d="M 90,345 C 125,328 150,355 185,340 C 220,326 255,352 295,338 C 335,325 375,348 415,335 C 435,328 450,338 465,332 L 465,360 L 90,360 Z" opacity="0.9"/>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- TYPOGRAPHY: "il Veliero" & "Ristorante"        -->
    <!-- ============================================== -->
    <!-- Script "il Veliero" -->
    <text x="250" y="425" 
          font-family="'Brush Script MT', 'Great Vibes', 'Edwardian Script ITC', 'Lucida Calligraphy', cursive" 
          font-size="68" 
          font-weight="bold"
          font-style="italic"
          fill="#0b2545" 
          text-anchor="middle"
          letter-spacing="1">
      il Veliero
    </text>

    <!-- Clean Sans-Serif "Ristorante" -->
    <text x="250" y="465" 
          font-family="'Montserrat', 'Century Gothic', 'Helvetica Neue', sans-serif" 
          font-size="28" 
          font-weight="400"
          fill="#0b2545" 
          text-anchor="middle"
          letter-spacing="5">
      Ristorante
    </text>
  </g>
</svg>
