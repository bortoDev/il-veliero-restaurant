<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" aria-label="Biglietto da Visita Retro — Dati Ufficiali Il Veliero Bassano">
  <defs>
    <linearGradient id="cardBackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6e6f2"/>
      <stop offset="50%" stop-color="#b9d6eb"/>
      <stop offset="100%" stop-color="#a2c4de"/>
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b2545" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g id="business-card-back" filter="url(#cardShadow)">
    <!-- Card Surface -->
    <rect x="20" y="20" width="960" height="560" rx="16" fill="url(#cardBackBg)" stroke="#8da9c4" stroke-width="2"/>

    <!-- Left Side: Both Logos -->
    <g id="left-logos" transform="translate(180, 200)">
      <!-- Veliero Logo -->
      <circle cx="-60" cy="-60" r="55" fill="#ffffff" stroke="#0096c7" stroke-width="2"/>
      <text x="-60" y="18" font-family="'Brush Script MT', cursive" font-size="24" font-weight="bold" fill="#0b2545" text-anchor="middle">il Veliero</text>
      <text x="-60" y="32" font-family="'Montserrat', sans-serif" font-size="10" fill="#0b2545" text-anchor="middle" letter-spacing="2">Ristorante</text>

      <!-- Campione Logo -->
      <circle cx="60" cy="-60" r="55" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
      <text x="60" y="-70" font-family="'Impact', sans-serif" font-size="16" fill="#ffd166" stroke="#000" stroke-width="1" text-anchor="middle">PIZZA</text>
      <text x="60" y="-50" font-family="'Impact', sans-serif" font-size="9" fill="#0b2545" text-anchor="middle">CAMPIONE DEL MONDO</text>
      <text x="60" y="32" font-family="'Impact', sans-serif" font-size="10" fill="#bc6c25" text-anchor="middle">RISTORANTE - PIZZERIA</text>
    </g>

    <!-- Right Side: Official Business Information -->
    <g id="right-info" transform="translate(420, 70)" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" fill="#1d2d44">
      <!-- Legal Entity Name -->
      <text x="0" y="20" font-size="22" font-weight="bold" fill="#0b2545">
        Pizza dal Campione del Mondo s.n.c.
      </text>
      <text x="0" y="48" font-size="18" font-style="italic" fill="#334155">
        di Bortolato Federico e Mazzeracca Sabina
      </text>

      <!-- Physical Address -->
      <text x="0" y="90" font-size="18" font-weight="600">
        Via G. Fattori, 7
      </text>
      <text x="0" y="118" font-size="18" font-weight="600">
        36061 Bassano del Grappa (VI)
      </text>
      <text x="0" y="146" font-size="16" fill="#475569">
        (Località San Michele)
      </text>

      <!-- Telephone -->
      <text x="0" y="196" font-size="18" font-weight="bold" fill="#0b2545">
        Tel. 0424 500 200
      </text>

      <!-- Emails -->
      <text x="0" y="260" font-size="16" fill="#134074">
        info@ristorante-ilveliero.it
      </text>
      <text x="0" y="286" font-size="16" fill="#134074">
        pizzadalcampione@gmail.com
      </text>

      <!-- Opening Hours Highlights -->
      <text x="0" y="328" font-size="16" font-weight="bold" fill="#0b2545" letter-spacing="1">
        APERTO ANCHE A PRANZO
      </text>
      <text x="0" y="356" font-size="16" font-weight="bold" fill="#bc6c25">
        Chiuso il Mercoledì
      </text>

      <!-- Fiscal IDs -->
      <text x="0" y="398" font-size="15" font-weight="600" fill="#334155">
        Cod. F./P.I. 03450720242 — SDI P62QHVQ
      </text>
    </g>

    <!-- Bottom Border & Social Profiles -->
    <line x1="50" y1="495" x2="950" y2="495" stroke="#334155" stroke-width="1.5"/>

    <g id="bottom-socials" transform="translate(60, 535)" font-family="'Montserrat', sans-serif" font-size="16" font-weight="bold" fill="#0b2545">
      <!-- Left Social -->
      <text x="0" y="0">
        📘 📷  Ristorante il Veliero - Bassano
      </text>
      <!-- Right Social -->
      <text x="460" y="0">
        📘 📷  Pizzeria dal Campione del Mondo
      </text>
    </g>
  </g>
</svg>
