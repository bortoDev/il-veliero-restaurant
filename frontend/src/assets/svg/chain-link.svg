<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 70" width="100%" height="100%" aria-label="Maglia Catena Singola — Il Veliero">
  <defs>
    <linearGradient id="linkIron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="linkStud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <g id="single-link" transform="translate(8, 7)">
    <!-- Outer Oval -->
    <path d="M 12,0 C 5.37,0 0,6 0,14 L 0,42 C 0,50 5.37,56 12,56 C 18.63,56 24,50 24,42 L 24,14 C 24,6 18.63,0 12,0 Z" fill="url(#linkIron)" stroke="#0b1329" stroke-width="1.5"/>
    <!-- Inner Cutout -->
    <path d="M 12,10 C 8.7,10 6,12.5 6,16 L 6,40 C 6,43.5 8.7,46 12,46 C 15.3,46 18,43.5 18,40 L 18,16 C 18,12.5 15.3,10 12,10 Z" fill="#07192f" opacity="0.85"/>
    <!-- Stud Crossbar -->
    <rect x="5.5" y="25" width="13" height="6" rx="2" fill="url(#linkStud)" stroke="#0b1329" stroke-width="1"/>
    <line x1="8" y1="27" x2="16" y2="27" stroke="#94a3b8" stroke-width="0.75" opacity="0.8"/>
  </g>
</svg>
