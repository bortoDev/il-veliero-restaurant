<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" aria-label="Targhetta in Legno Appesa con Corde — Il Veliero">
  <defs>
    <!-- Woodgrain Texture & Gradients -->
    <linearGradient id="plankWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#935d33"/>
      <stop offset="15%" stop-color="#ab7344"/>
      <stop offset="45%" stop-color="#804e28"/>
      <stop offset="70%" stop-color="#693e1e"/>
      <stop offset="100%" stop-color="#4f2b12"/>
    </linearGradient>

    <linearGradient id="plankBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49b6a" stop-opacity="0.9"/>
      <stop offset="10%" stop-color="#ab7344" stop-opacity="0.2"/>
      <stop offset="90%" stop-color="#2a1508" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#190b03" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="ropeHemp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d5b5"/>
      <stop offset="40%" stop-color="#d4a373"/>
      <stop offset="80%" stop-color="#a07844"/>
      <stop offset="100%" stop-color="#6b4d24"/>
    </linearGradient>

    <linearGradient id="bracketIron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="brassNail" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#dda15e"/>
      <stop offset="100%" stop-color="#542a04"/>
    </radialGradient>

    <filter id="plaqueDropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#07192f" flood-opacity="0.35"/>
    </filter>

    <filter id="ropeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#07192f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g id="hanging-wood-plaque-group" filter="url(#plaqueDropShadow)">
    <!-- ============================================== -->
    <!-- TOP WALL HOOK / MOUNTING RING                  -->
    <!-- ============================================== -->
    <g id="top-mount" filter="url(#ropeShadow)">
      <!-- Iron Peg / Bolt -->
      <circle cx="160" cy="14" r="8" fill="url(#bracketIron)" stroke="#0b1329" stroke-width="1.5"/>
      <circle cx="160" cy="14" r="3" fill="#94a3b8"/>
      <!-- Iron Master Ring -->
      <circle cx="160" cy="22" r="11" fill="none" stroke="url(#bracketIron)" stroke-width="4.5"/>
      <circle cx="160" cy="22" r="11" fill="none" stroke="#07192f" stroke-width="1"/>
    </g>

    <!-- ============================================== -->
    <!-- TWIN TWISTED HEMP ROPES                        -->
    <!-- ============================================== -->
    <!-- Left Rope (Top ring 160,25 -> Plaque Eyelet 65,80) -->
    <g id="left-rope" filter="url(#ropeShadow)">
      <path d="M 154,28 Q 110,50 65,80" fill="none" stroke="url(#ropeHemp)" stroke-width="6" stroke-linecap="round"/>
      <!-- Rope Twisted Strands Texture Overlay -->
      <path d="M 154,28 Q 110,50 65,80" fill="none" stroke="#543715" stroke-width="5" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.6"/>
      <path d="M 154,28 Q 110,50 65,80" fill="none" stroke="#fff4cc" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.7"/>

      <!-- Rope Knot / Whipping at Bottom -->
      <rect x="61" y="70" width="8" height="12" rx="2" fill="url(#ropeHemp)" stroke="#543715" stroke-width="1"/>
      <line x1="61" y1="73" x2="69" y2="73" stroke="#543715" stroke-width="1"/>
      <line x1="61" y1="76" x2="69" y2="76" stroke="#543715" stroke-width="1"/>
      <line x1="61" y1="79" x2="69" y2="79" stroke="#543715" stroke-width="1"/>
    </g>

    <!-- Right Rope (Top ring 160,25 -> Plaque Eyelet 255,80) -->
    <g id="right-rope" filter="url(#ropeShadow)">
      <path d="M 166,28 Q 210,50 255,80" fill="none" stroke="url(#ropeHemp)" stroke-width="6" stroke-linecap="round"/>
      <!-- Rope Twisted Strands Texture Overlay -->
      <path d="M 166,28 Q 210,50 255,80" fill="none" stroke="#543715" stroke-width="5" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.6"/>
      <path d="M 166,28 Q 210,50 255,80" fill="none" stroke="#fff4cc" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.7"/>

      <!-- Rope Knot / Whipping at Bottom -->
      <rect x="251" y="70" width="8" height="12" rx="2" fill="url(#ropeHemp)" stroke="#543715" stroke-width="1"/>
      <line x1="251" y1="73" x2="259" y2="73" stroke="#543715" stroke-width="1"/>
      <line x1="251" y1="76" x2="259" y2="76" stroke="#543715" stroke-width="1"/>
      <line x1="251" y1="79" x2="259" y2="79" stroke="#543715" stroke-width="1"/>
    </g>

    <!-- Plaque Metallic Eyelet Rings -->
    <circle cx="65" cy="80" r="7" fill="none" stroke="url(#bracketIron)" stroke-width="3"/>
    <circle cx="255" cy="80" r="7" fill="none" stroke="url(#bracketIron)" stroke-width="3"/>

    <!-- ============================================== -->
    <!-- WOODEN PLANK WITH REALISTIC GRAIN              -->
    <!-- ============================================== -->
    <g id="wooden-plank" transform="translate(0, 5)">
      <!-- Main Wood Base Board -->
      <rect x="25" y="75" width="270" height="85" rx="8" fill="url(#plankWood)" stroke="#3e200c" stroke-width="2"/>
      <!-- Inner Bevel & Highlights -->
      <rect x="27" y="77" width="266" height="81" rx="6" fill="url(#plankBevel)"/>

      <!-- Organic Wood Grain Lines -->
      <g id="woodgrain" opacity="0.35" stroke="#331807" stroke-linecap="round" fill="none">
        <path d="M 32,88 Q 110,84 288,86" stroke-width="1.2"/>
        <path d="M 30,98 Q 90,102 180,96 T 290,100" stroke-width="1.5"/>
        <path d="M 35,112 C 80,110 140,116 210,111 C 250,108 275,112 288,110" stroke-width="1"/>
        <path d="M 30,126 Q 130,122 220,128 T 290,124" stroke-width="1.6"/>
        <path d="M 35,140 Q 150,144 285,138" stroke-width="1.2"/>
        <path d="M 32,150 Q 170,146 288,152" stroke-width="1"/>

        <!-- Wood Knot Swirl (Left) -->
        <ellipse cx="78" cy="115" rx="10" ry="5" stroke-width="1.4"/>
        <ellipse cx="78" cy="115" rx="4" ry="2" stroke-width="1.8" fill="#331807" fill-opacity="0.4"/>
        <!-- Wood Knot Swirl (Right) -->
        <ellipse cx="235" cy="132" rx="12" ry="6" stroke-width="1.3"/>
        <ellipse cx="235" cy="132" rx="5" ry="2.5" stroke-width="1.6" fill="#331807" fill-opacity="0.4"/>
      </g>

      <!-- Corner Iron Reinforcement Brackets & Rivets -->
      <!-- Top-Left Bracket -->
      <polygon points="25,75 45,75 25,95" fill="url(#bracketIron)" stroke="#0b1329" stroke-width="1"/>
      <circle cx="33" cy="83" r="2.5" fill="url(#brassNail)"/>

      <!-- Top-Right Bracket -->
      <polygon points="295,75 275,75 295,95" fill="url(#bracketIron)" stroke="#0b1329" stroke-width="1"/>
      <circle cx="287" cy="83" r="2.5" fill="url(#brassNail)"/>

      <!-- Bottom-Left Bracket -->
      <polygon points="25,160 45,160 25,140" fill="url(#bracketIron)" stroke="#0b1329" stroke-width="1"/>
      <circle cx="33" cy="152" r="2.5" fill="url(#brassNail)"/>

      <!-- Bottom-Right Bracket -->
      <polygon points="295,160 275,160 295,140" fill="url(#bracketIron)" stroke="#0b1329" stroke-width="1"/>
      <circle cx="287" cy="152" r="2.5" fill="url(#brassNail)"/>
    </g>
  </g>
</svg>
