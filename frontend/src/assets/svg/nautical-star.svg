<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Stella Nautica a 8 Punte — Il Veliero">
  <defs>
    <linearGradient id="starNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134074"/>
      <stop offset="70%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#07192f"/>
    </linearGradient>

    <linearGradient id="starGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="50%" stop-color="#fefae0"/>
      <stop offset="100%" stop-color="#dda15e"/>
    </linearGradient>

    <linearGradient id="starGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dda15e"/>
      <stop offset="70%" stop-color="#bc6c25"/>
      <stop offset="100%" stop-color="#7f3b08"/>
    </linearGradient>

    <radialGradient id="centerRivet" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#dda15e"/>
      <stop offset="100%" stop-color="#8a4b12"/>
    </radialGradient>

    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#07192f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g id="nautical-star-group" filter="url(#starShadow)">
    <!-- Outer Decorative Concentric Thin Rings -->
    <circle cx="100" cy="100" r="92" fill="none" stroke="#dda15e" stroke-width="1" opacity="0.6"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#0b2545" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.7"/>

    <!-- ============================================== -->
    <!-- 4 SECONDARY 45-DEGREE POINTS                   -->
    <!-- ============================================== -->
    <g id="star-secondary">
      <!-- Top-Right Point (45 deg) -->
      <polygon points="100,100 139,61 100,88" fill="url(#starGoldLight)" stroke="#bc6c25" stroke-width="0.5"/>
      <polygon points="100,100 139,61 112,100" fill="url(#starNavy)" stroke="#07192f" stroke-width="0.5"/>

      <!-- Bottom-Right Point (135 deg) -->
      <polygon points="100,100 139,139 112,100" fill="url(#starGoldLight)" stroke="#bc6c25" stroke-width="0.5"/>
      <polygon points="100,100 139,139 100,112" fill="url(#starNavy)" stroke="#07192f" stroke-width="0.5"/>

      <!-- Bottom-Left Point (225 deg) -->
      <polygon points="100,100 61,139 100,112" fill="url(#starGoldLight)" stroke="#bc6c25" stroke-width="0.5"/>
      <polygon points="100,100 61,139 88,100" fill="url(#starNavy)" stroke="#07192f" stroke-width="0.5"/>

      <!-- Top-Left Point (315 deg) -->
      <polygon points="100,100 61,61 88,100" fill="url(#starGoldLight)" stroke="#bc6c25" stroke-width="0.5"/>
      <polygon points="100,100 61,61 100,88" fill="url(#starNavy)" stroke="#07192f" stroke-width="0.5"/>
    </g>

    <!-- ============================================== -->
    <!-- 4 PRIMARY CARDINAL POINTS                      -->
    <!-- ============================================== -->
    <g id="star-primary">
      <!-- North Point -->
      <polygon points="100,100 100,10 86,100" fill="url(#starNavy)" stroke="#07192f" stroke-width="0.75"/>
      <polygon points="100,100 100,10 114,100" fill="url(#starGoldLight)" stroke="#bc6c25" stroke-width="0.75"/>

      <!-- East Point -->
      <polygon points="100,100 190,100 100,86" fill="url(#starNavy)" stroke="#07192f" stroke-width="0.75"/>
      <polygon points="100,100 190,100 100,114" fill="url(#starGoldLight)" stroke="#bc6c25" stroke-width="0.75"/>

      <!-- South Point -->
      <polygon points="100,100 100,190 114,100" fill="url(#starNavy)" stroke="#07192f" stroke-width="0.75"/>
      <polygon points="100,100 100,190 86,100" fill="url(#starGoldLight)" stroke="#bc6c25" stroke-width="0.75"/>

      <!-- West Point -->
      <polygon points="100,100 10,100 100,114" fill="url(#starNavy)" stroke="#07192f" stroke-width="0.75"/>
      <polygon points="100,100 10,100 100,86" fill="url(#starGoldLight)" stroke="#bc6c25" stroke-width="0.75"/>
    </g>

    <!-- Center Boss / Rivet -->
    <circle cx="100" cy="100" r="14" fill="url(#starGoldDark)" stroke="#542a04" stroke-width="1.2"/>
    <circle cx="100" cy="100" r="9" fill="url(#centerRivet)" stroke="#bc6c25" stroke-width="0.8"/>
    <circle cx="98" cy="98" r="3" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
