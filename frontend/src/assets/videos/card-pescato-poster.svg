<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" aria-label="Poster Pescato — Pescato Fresco del Giorno">
  <defs>
    <!-- Ice & Deep Ocean Gradients -->
    <radialGradient id="iceGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0fbfc"/>
      <stop offset="70%" stop-color="#8da9c4"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </radialGradient>

    <!-- Silver Fish Scales Gradient -->
    <linearGradient id="fishSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="fishRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="50%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>

    <linearGradient id="lemonYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffff3f"/>
      <stop offset="70%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e9c46a"/>
    </linearGradient>

    <filter id="pescatoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#07192f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Crushed Ice Backdrop -->
  <rect width="800" height="600" fill="url(#iceGlow)"/>

  <!-- Sparkling Crushed Ice Texture Facets -->
  <g fill="#ffffff" fill-opacity="0.4" stroke="#8da9c4" stroke-width="0.8">
    <polygon points="50,450 120,410 160,470 90,520"/>
    <polygon points="140,510 220,460 260,530 180,570"/>
    <polygon points="280,480 360,440 400,500 320,550"/>
    <polygon points="450,470 540,420 580,490 500,540"/>
    <polygon points="600,450 680,410 730,480 650,530"/>
    <polygon points="100,150 180,110 220,180 140,220"/>
    <polygon points="650,180 730,130 780,200 700,240"/>
  </g>

  <!-- ============================================== -->
  <!-- FRESH FISH & SEAFOOD ON ICE                    -->
  <!-- ============================================== -->
  <g id="seafood-display" filter="url(#pescatoShadow)">
    <!-- Big Sea Bass (Branzino all'Adriatico) -->
    <g id="sea-bass" transform="translate(420, 260) rotate(-12)">
      <!-- Fish Body Silhouette -->
      <path d="M -240,0 
               C -200,-70 50,-80 180,-20 
               C 220,-10 250,0 270,0 
               L 310,-45 L 290,0 L 310,45 L 270,0 
               C 250,0 220,10 180,20 
               C 50,80 -200,70 -240,0 Z" 
            fill="url(#fishSilver)" stroke="#334155" stroke-width="2.5"/>

      <!-- Dorsal Fin (Pinna Dorsale) -->
      <path d="M -80,-68 Q 20,-110 120,-48 L 110,-40 Q 20,-75 -70,-55 Z" fill="#64748b" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Pectoral Fin -->
      <path d="M -110,15 Q -60,45 -30,20 Q -65,5 -110,15 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

      <!-- Gills & Eye (Branchia e Occhio Fresco) -->
      <path d="M -150,-45 C -130,-20 -130,20 -150,45" fill="none" stroke="#1e293b" stroke-width="2.5"/>
      <circle cx="-190" cy="-15" r="9" fill="#0b2545" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-192" cy="-17" r="3" fill="#ffffff"/>

      <!-- Fish Lateral Line & Scales Sheen -->
      <path d="M -130,0 Q 30,5 250,0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 2"/>
    </g>

    <!-- Red Mullet (Triglia di Fango) -->
    <g id="red-mullet" transform="translate(320, 380) rotate(8)">
      <path d="M -160,0 C -130,-45 20,-50 110,-12 C 140,-5 160,0 170,0 L 200,-28 L 185,0 L 200,28 L 170,0 C 160,0 140,5 110,12 C 20,50 -130,45 -160,0 Z" 
            fill="url(#fishRed)" stroke="#590d22" stroke-width="2"/>
      <!-- Eye -->
      <circle cx="-125" cy="-10" r="7" fill="#0b2545" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="-127" cy="-12" r="2" fill="#ffffff"/>
      <!-- Barbels (Barbigli) -->
      <line x1="-150" y1="8" x2="-165" y2="25" stroke="#ff758f" stroke-width="1.5"/>
    </g>

    <!-- Giant Scampi / Gamberone -->
    <g id="gamberone" transform="translate(560, 390) rotate(-35)">
      <path d="M -70,-20 C -40,-65 40,-65 70,-20 C 85,20 50,60 10,60 C -30,60 -75,20 -70,-20 Z" fill="#ff758f" stroke="#c9184a" stroke-width="2"/>
      <line x1="70" y1="-20" x2="130" y2="-45" stroke="#ff4d6d" stroke-width="2"/>
      <line x1="70" y1="-20" x2="140" y2="-5" stroke="#ff4d6d" stroke-width="2"/>
    </g>

    <!-- Fresh Lemon Slices -->
    <g id="lemon-slice-1" transform="translate(180, 240)">
      <circle cx="0" cy="0" r="42" fill="url(#lemonYellow)" stroke="#c58231" stroke-width="2"/>
      <circle cx="0" cy="0" r="36" fill="#ffffff" opacity="0.9"/>
      <circle cx="0" cy="0" r="32" fill="url(#lemonYellow)"/>
      <!-- 8 Lemon Wedges -->
      <g stroke="#ffffff" stroke-width="2">
        <line x1="0" y1="-32" x2="0" y2="32"/>
        <line x1="-32" y1="0" x2="32" y2="0"/>
        <line x1="-23" y1="-23" x2="23" y2="23"/>
        <line x1="-23" y1="23" x2="23" y2="-23"/>
      </g>
    </g>

    <!-- Rosemary Sprig -->
    <g id="rosemary" transform="translate(230, 340) rotate(45)" stroke="#2d6a4f" stroke-width="2.5" stroke-linecap="round">
      <line x1="-50" y1="0" x2="60" y2="0" stroke="#1b4332" stroke-width="3"/>
      <line x1="-30" y1="0" x2="-20" y2="-18"/>
      <line x1="-15" y1="0" x2="-5" y2="18"/>
      <line x1="0" y1="0" x2="10" y2="-18"/>
      <line x1="15" y1="0" x2="25" y2="18"/>
      <line x1="30" y1="0" x2="40" y2="-18"/>
    </g>
  </g>

  <!-- Overlay Text Badge -->
  <rect x="0" y="480" width="800" height="120" fill="linear-gradient(to top, rgba(7,25,47,0.95), transparent)"/>
  <text x="400" y="550" font-family="'Cinzel', serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    PESCATO DEL GIORNO
  </text>
</svg>
